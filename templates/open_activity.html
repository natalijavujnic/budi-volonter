{%load static%}
<!--autor:Kosta Novokmet-->
<!DOCTYPE html>
<html lang="en">
	<head>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
		<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-multiselect/0.9.13/css/bootstrap-multiselect.css'">
		<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-multiselect/0.9.13/js/bootstrap-multiselect.min.js"></script>
		<link href="{% static 'CSS/main_page.css'%}" rel="stylesheet">
		<link href="{% static 'CSS/org_profile.css'%}" rel="stylesheet">
		<title>Document</title>
		<script src="{% static 'JS/switchPage.js'%}"></script>
	</head>
	<body>
		<nav class="navbar navbar-expand-lg navbar-light" style="background-color: #C2DA91;">
			<div class="container-fluid">
				<a class="navbar-brand" href="main_page.html"><img src="{% static 'resources/bvp5.png' %}" height="60px" width="60px"></a>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarSupportedContent">
					<ul class="navbar-nav me-auto mb-2 mb-lg-0">
						<li class="nav-item">
							<button onclick = "switchPage('choose_search.html')"class="searchButton btn rounded-circle" type="submit"><i class="bi bi-people-fill" style="color: #37401C;" title="Pretraga korisnika"></i></button>

						</li>
						<li class="nav-item" >
							<button onclick="switchPage('search_act.html')" class="searchButton btn rounded-circle" type="submit"><i class="bi bi-flag-fill" style="color: #37401C;" title="Pretraga aktivnosti"></i></button>
						</li>
					</ul>

					<ul class="navbar-nav me-auto mb-2 mb-lg-0 mx-right">
						<div class="container">
							<li class="nav-item">
								<button class="searchButton btn" id="OtvoriAkt" type="submit"><i class="bi bi-send-fill mr-1"></i>Otvori Aktivnost</button>
							</li>
						</div>
					</ul>

					<div class="d-flex align-items-center">
						<button class="searchButton btn" type="submit"><i class="bi bi-person-lines-fill mr-1"></i>Profil</button>
						<button id = "inbox" class="searchButton btn d-flex align-items-center justify-content-center" style="color:#37401C;background-color:#D3E7A6;"><i class="bi bi-chat-left-text-fill mr-1"></i>Prepiske<span style="color:#F8FAF3" class="badge bg-danger ml-1">7</span>
						</button>
						<div class="d-flex flex-column justify-content-end align-items-end pl-1">
							<a style="color:#5C7C2F; font-size: 30px;" href="logout"><i class="bi bi-box-arrow-right" title="Izlogujte se"></i></a>
						</div>
					</div>
				</div>
			</div>
		</nav>
		<h1 style='color:green'> {{status}} </h1>
		<div class="container-fluid">
			<div class="col-md-6 mx-auto">
				<form class="card mt-5" method='POST'>
					<div class="form-group">
						<label for="name">Ime aktivnosti</label>
						<input type="text" class="form-control" id="name"name="name"  placeholder="Unesite ime aktivnosti">
					</div>
					<div class="form-group">
						<label for="desc">Opis</label>
						<textarea id='desc' name = 'desc'class="form-control" rows="5" cols="10"></textarea>
					</div>
					<div class="form-group">
						<label for="spots">Broj mesta</label>
						<input id='spots' name = 'spots'class="form-control" type='number' min='1'>
					</div>
					<label for="startDate">Pocetak</label>
					<input id="startDate"name="startDate" class="form-control" type="date" />       
					<label for="endDate">Kraj</label>
					<input id="endDate" name="endDate" class="form-control" type="date" /> 
					<label for="deadlineDate">Rok za prijave</label>
					<input id="deadlineDate" name='deadlineDate' class="form-control" type="date" /> 
					<label for="cat">Kategorije</label>
					<select id="cat" name='categories' class="form-control" multiple>
						{% for cat in cats %}
						<option value='{{cat}}'>{{cat}}</option>
						{% endfor %}
					</select>
					<label for="country">Zemlja</label>
					<select id="country" name='country' class="form-control">
						{% for country in countries %}
						<option value = '{{country}}'> {{country}}</option>
						{% endfor %}
					</select>
					<label for="city">Ime mesta</label>
					<input type="text" class="form-control" id="city"name="city"  placeholder="Unesite ime mesta">
					<label for="reqs">Zahtevi *svaki zahtev uneti red po red*</label>
					<textarea name="reqs" id="reqs" cols="30" rows="10"></textarea>
					<script>
						$(document).ready(function() {
							$('#cat').multiselect({
								includeSelectAllOption: true
							});
						});
					</script>
					<button type="submit" class="btn" style="background-color: #C2DA91;">POTVRDI</button>
				</form>   
			</div>
		</div>
		<style>
.multiselect-container li a label.checkbox {
	color: #ABC978; /* Change the color here */
}
		</style>
	</body>
</html>
