{%load static%}
<!--natalija-->
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="{% static 'CSS/main_page.css'%}" rel="stylesheet">
	<link href="{% static 'CSS/org_profile.css'%}" rel="stylesheet">
    <link href="{% static 'CSS/volonteer_profile.css'%}" rel="stylesheet">
    <title>Moj profil</title>
    <script src="{% static 'JS/switchPage.js'%}"></script>
    <script src="{% static './JS/fetch_activities_vol.js' %}"></script>

</head>
<body onload='fetch_activities()'>
    <nav class="navbar navbar-expand-lg navbar-light" style="background-color: #C2DA91;">
        <div class="container-fluid">

            <a class="navbar-brand" href="main_page.html"><img src="{% static 'resources/bvp5.png'%}" height="60px" width="60px"></a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                      <button onclick = "switchPage('choose_search.html')"class="searchButton btn rounded-circle" type="submit"><i class="bi bi-people-fill" style="color: #37401C;" title="Pretraga korisnika"></i></button>
      
                    </li>
                    <li class="nav-item" >
                      <button onclick="switchPage('search_act.html')" class="searchButton btn rounded-circle" type="submit"><i class="bi bi-flag-fill" style="color: #37401C;" title="Pretraga aktivnosti"></i></button>
                    </li>
                  </ul>
           
 
            <div class="d-flex align-items-center">
                <button class="searchButton btn" type="submit"><i class="bi bi-person-lines-fill mr-1"></i>Profil</button>
                <button id = "inbox" class="searchButton btn d-flex align-items-center justify-content-center" style="color:#37401C;background-color:#D3E7A6;"><i class="bi bi-chat-left-text-fill mr-1"></i>Prepiske<span style="color:#F8FAF3" class="badge bg-danger ml-1">7</span>
                </button>
                <div class="d-flex flex-column justify-content-end align-items-end pl-1">
                    <a style="color:#5C7C2F; font-size: 30px;" href="logout"><i class="bi bi-box-arrow-right" title="Izlogujte se"></i></a>
                </div>
            </div>
          </div>
        </div>
      </nav>

    <div class="container-fluid">
        <div class="row">
            <!--Informacije o profilu-->
            <div class="col-sm-4" style="background-color: #F2FAFB;">
                <div class="d-flex justify-content-end" style="padding: 15px;">
                    <a href="{% static './vol_edit.html'%}">
                        <div id="EDIT" class="btn" title="Uredi profil"><i class="bi bi-pen-fill"></i></div>
                    </a>
                </div>
                <div id="user-info">
                    <table class ="table" id="user-info">
                    <tr>
                        <td>Ime: </td>
                        <td>{{korisnik.ime}}</td>
                    </tr>
                    <tr>
                        <td>Prezime: </td>
                        <td>{{korisnik.prezime}}</td>
                    </tr>
                    <tr>
                        <td>Datum rođenja: </td>
                        <td>{{korisnik.telefon}}</td>
                    </tr>
                    <tr>
                        <td>E-mail: </td>
                        <td id = 'email'>{{korisnik.email}}</td>
                    </tr>
                    </table>
                </div>
                <div id="user-int" style="margin: 10px;">
                    Interesovanja:
                    <ul style="padding-left: 25px; ">
                        {% for interes in interesi %}
                            <li type="square" style="margin: 5px;">{{ interes }}</li>
                        {% endfor %}
                        </ul>
                </div>
                <div class="d-flex justify-content-center" style="padding: 15px;">
                    <a href="{% static './vol_review_org.html'%}">
                        <div class="btn ostavi-rec">Ostavi recenzije</div>
                    </a>
                </div>
            </div>
            <!--Aktivnosti-->
            <div class="col-sm-8" style="padding: 0px;">
                <div class="container" id='sve_aktivnosti'>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
