{%load static%}
<!--natalija-->
<!DOCTYPE html>
<html lang="en">
	<head>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
		<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
		<link href="{% static './CSS/main_page.css' %}" rel="stylesheet">
		<link href="{% static './CSS/org_profile.css' %}" rel="stylesheet">
		<link href="{% static './CSS/volonteer_profile.css' %}" rel="stylesheet">
		<title>Moj profil</title>
		<script src="{% static './JS/switchPage.js' %}"></script>
	</head>
	<body>
		{{navbar|safe}}
		<div class="container" style="margin-top:40px;">
			<div class="row">
				<!--Informacije o profilu-->
				<div class="col-sm-3"></div>
				<div class="col-sm-6" style="background-color: #F2FAFB;">
					<div id="org-info">
						<form id="edit-form">
							<table class="table" id="user-info">
								<tr>
									<td>Ime:</td>
									<td><input type="text" name="ime" value="Petar"></td>
								</tr>
								<tr>
									<td>Prezime:</td>
									<td><input type="text" name="prezime" value="Petrovic"></td>
								</tr>
								<tr>
									<td>Datum rođenja:</td>
									<td><input type="date" name="datum_rodjenja" value="2001-01-01"></td>
								</tr>
								<tr>
									<td>E-mail:</td>
									<td>petar@petrovic.rs</td>
								</tr>
								<tr>
									<td>Interesovanja: </td>
									<td>
										<div class="form-group">
											<input type="checkbox" id="interes1" name="interes" value="interes1">
											<label for="interes1">Interes 1</label><br>
											<input type="checkbox" id="interes2" name="interes" value="interes2">
											<label for="interes2">Interes 2</label><br>
											<!-- Dodajte dodatna interesovanja po potrebi -->
										</div>
									</td>

								</tr>
								<tr>
									<td colspan="2">
										<div class="row">
											<div class="col-sm-6 d-flex">
												<a href="{% static './volonteer_profile.html" class="btn btn-primary" onclick="cancel()">Odustani</a>
											</div>
											<div class="col-sm-6 d-flex justify-content-end">
												<a href="{% static './volonteer_profile.html" class="btn btn-primary" onclick="submitForm()">Potvrdi</a>
											</div>
										</div>

									</td>
								</tr>
							</table>
						</form>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
